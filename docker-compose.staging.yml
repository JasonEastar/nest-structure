# c9_map staging — 1 máy: nginx (least_conn, cùng nginx.conf với dev) → api-1, api-2 (image runtime) → postgres, redis.
# Chỉ nginx mở port 80 ra ngoài. Cách dùng: docs/deploy-staging.md
#   docker compose -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml run --rm api-1 node dist/migrate.js
# .env trên server cần POSTGRES_PASSWORD, DATABASE_URL trỏ postgres://c9:<POSTGRES_PASSWORD>@postgres:5432/c9_map, REDIS_URL=redis://redis:6379.

name: c9_staging

x-api: &api
  build:
    context: .
    target: runtime
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  stop_grace_period: 60s
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  api-1:
    <<: *api
    environment:
      PORT: 3000
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      PORT: 3000
      INSTANCE_ID: api-2

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: c9
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: c9_map
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c9 -d c9_map"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
