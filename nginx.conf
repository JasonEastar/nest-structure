# c9_map — reverse proxy trước N instance api (dev: api-1, api-2).
# least_conn, KHÔNG ip_hash (ip_hash che giấu bug state-in-RAM).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Instance phải có keepAliveTimeout > giá trị này (app đặt 65s).
  keepalive_timeout 60s;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  upstream api {
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 1m;   # upload ảnh đi thẳng R2 (presigned), API chỉ nhận JSON

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Giữ X-Request-Id client gửi (trace xuyên hệ thống), không có thì nginx sinh; app validate + echo.
      proxy_set_header X-Request-Id $req_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
