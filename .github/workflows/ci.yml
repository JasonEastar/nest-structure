# CI cho c9_map (docs/testing-and-ci.md §5): lint → typecheck → unit → integration (testcontainers) → build → openapi artifact.
# Postgres/Redis: `services` thật (TEST_REUSE_INFRA=1) — testcontainers dành cho máy dev. Job supabase-real chỉ chạy khi
# push + repo variable SUPABASE_REAL_TESTS=true + secrets. Migrate/deploy: bước riêng, thêm khi có môi trường.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Postgres/Redis là `services` thật của job (dùng cho integration qua TEST_REUSE_INFRA=1 và cho openapi export).
  DATABASE_URL: postgres://c9:c9@127.0.0.1:5432/c9_map_test
  REDIS_URL: redis://127.0.0.1:6379
  TEST_REUSE_INFRA: '1'
  SUPABASE_URL: https://ci-placeholder.supabase.co
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_0123456789
  LOG_LEVEL: warn

jobs:
  check:
    name: lint · typecheck · unit · integration · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: c9_map_test, POSTGRES_USER: c9, POSTGRES_PASSWORD: c9 }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U c9 -d c9_map_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Export OpenAPI (app + admin)
        run: node dist/openapi-export.js
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/*.json
          if-no-files-found: error

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: c9_map:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  supabase-real:
    name: integration với Supabase thật
    runs-on: ubuntu-latest
    needs: check
    if: ${{ github.event_name == 'push' && vars.SUPABASE_REAL_TESTS == 'true' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: c9_map_test, POSTGRES_USER: c9, POSTGRES_PASSWORD: c9 }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U c9 -d c9_map_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --project integration test/supabase-real.spec.ts
