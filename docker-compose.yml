# c9_map dev stack — luôn 2 instance api sau nginx để bug "state trong RAM" lộ sớm.
#   npm run dev:infra        → postgres + redis (rồi `npm run dev` trên host)
#   npm run dev:infra:full   → thêm api-1, api-2, nginx (test đa instance)
# Chỉ nginx publish ra ngoài (3000); các service khác bind 127.0.0.1.
# Trùng port với Postgres/Redis khác trên máy? Đặt PG_HOST_PORT / REDIS_HOST_PORT / NGINX_HOST_PORT trong .env.
#
# Lưu ý YAML: `environment:` ở service THAY THẾ (không merge) map trong anchor → anchor không khai environment;
# biến chung lấy từ .env (env_file), mỗi service chỉ ghi đè 3 biến phụ thuộc mạng compose.

name: c9_map

x-api: &api
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    - ./src:/app/src:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  stop_grace_period: 60s   # processor BullMQ chạy cùng process, đợi job xong
  restart: unless-stopped
  profiles: ["full"]

x-api-env: &api-env
  PORT: 3000
  DATABASE_URL: postgres://c9:c9@postgres:5432/c9_map
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: c9
      POSTGRES_PASSWORD: c9
      POSTGRES_DB: c9_map
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c9 -d c9_map"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # UI xem Redis: npm run dev:tools → http://localhost:5540 → Add database: host `redis`, port 6379 (db0 cache, db1 BullMQ)
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
    ports:
      - "127.0.0.1:3001:3000"

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    ports:
      - "127.0.0.1:3002:3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    profiles: ["full"]

volumes:
  pg-data:
  redis-data:
  redis-insight-data:
