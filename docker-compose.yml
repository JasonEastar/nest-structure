# Hạ tầng cho dev: Postgres + PostGIS, Redis (npm run dev:infra), RedisInsight (npm run dev:tools). App chạy trên host: npm run dev.
# Máy đã có Postgres/Redis khác chiếm 5432/6379? Đặt PG_HOST_PORT / REDIS_HOST_PORT trong .env (vd 5433/6380)
# VÀ sửa DATABASE_URL / REDIS_URL trỏ theo port đó.

name: c9_map

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: c9
      POSTGRES_PASSWORD: c9
      POSTGRES_DB: c9_map
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c9 -d c9_map"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # UI xem Redis: npm run dev:tools → http://localhost:5540 → Add database: host `redis`, port 6379 (db0 cache, db1 BullMQ)
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pg-data:
  redis-data:
  redis-insight-data:
